<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>SIMSEP - Usuários</title>
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="barraLateral" class="sidebar"></div>
    <div class="conteudo">
      <div class="cabecalho-pagina">
        <div>
          <h1>Usuários do sistema</h1>
          <p class="subtitulo">Cadastro restrito a administradores</p>
        </div>
      </div>

      <div class="painel">
        <form id="formUsuario">
          <div class="campo">
            <label>Nome</label>
            <input type="text" id="nome" required>
          </div>
          <div class="campo">
            <label>E-mail</label>
            <input type="email" id="email" required>
          </div>
          <div class="campo">
            <label>Senha provisória</label>
            <input type="password" id="senha" required minlength="6">
          </div>
          <div class="campo">
            <label>Perfil</label>
            <select id="perfil" required>
              <option value="operador">Operador de Segurança</option>
              <option value="engenheiro">Engenheiro de Minas</option>
              <option value="admin">Administrador</option>
            </select>
          </div>
          <button type="submit">Cadastrar usuário</button>
          <p class="erro" id="msgErro"></p>
        </form>
      </div>

      <div class="painel">
        <div class="tabela-scroll">
          <table>
            <thead>
              <tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Criado em</th><th></th></tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="js/menu.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
