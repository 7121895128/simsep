<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>SIMSEP - Painel</title>
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="barraLateral" class="sidebar"></div>
    <div class="conteudo">
      <div class="cabecalho-pagina">
        <div>
          <h1>Painel</h1>
          <p class="subtitulo">Visão geral do monitoramento</p>
        </div>
      </div>

      <div class="grade-resumo" id="grade-resumo"></div>

      <div class="painel">
        <h1 style="font-size:15px;">Alertas em aberto</h1>
        <div class="tabela-scroll">
          <table id="tabelaAlertas">
            <thead>
              <tr><th>Ponto</th><th>Mensagem</th><th>Data/Hora</th></tr>
            </thead>
            <tbody id="corpoAlertas"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="js/menu.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
